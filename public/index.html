<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Translator Call</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; height: 100vh; height: 100dvh; overflow: hidden; }

    /* ============ LOBBY ============ */
    #lobby {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; height: 100dvh; padding: 20px;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
    }
    .lobby-title { font-size: 32px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #4ade80, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .lobby-sub { font-size: 14px; color: #666; margin-bottom: 30px; }

    .perm-box {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 24px; margin-bottom: 24px; text-align: center; width: 100%; max-width: 360px;
    }
    .perm-box p { font-size: 13px; color: #888; margin-bottom: 16px; line-height: 1.5; }
    .perm-preview { width: 120px; height: 90px; border-radius: 12px; object-fit: cover; background: #111; margin: 0 auto 16px; display: block; border: 2px solid #333; }
    .perm-preview.active { border-color: #4ade80; }

    .btn { padding: 14px 28px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; width: 100%; max-width: 360px; }
    .btn:active { transform: scale(0.97); }
    .btn-perm { background: linear-gradient(135deg, #f59e0b, #f97316); color: #000; }
    .btn-create { background: linear-gradient(135deg, #4ade80, #22c55e); color: #000; margin-bottom: 12px; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    .room-list { width: 100%; max-width: 360px; margin-top: 24px; }
    .room-list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .room-list-header h3 { font-size: 14px; color: #666; }
    .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; border: none; cursor: pointer; }
    .room-item {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
    }
    .room-item:active { background: rgba(255,255,255,0.1); }
    .room-code { font-size: 20px; font-weight: 800; color: #4ade80; letter-spacing: 3px; }
    .room-users { font-size: 12px; color: #666; margin-top: 2px; }
    .room-join-btn { background: #60a5fa; color: #000; padding: 8px 18px; border-radius: 8px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; }
    .empty-msg { text-align: center; color: #444; font-size: 13px; padding: 20px; }
    .perm-status { font-size: 12px; margin-top: 10px; }
    .perm-ok { color: #4ade80; }
    .perm-fail { color: #ef4444; }

    /* ============ CALL — SPLIT SCREEN ============ */
    #call { display: none; position: fixed; inset: 0; background: #000; }
    #call.active { display: flex; }

    /* Landscape: side by side */
    .split { display: flex; width: 100%; height: 100%; }
    .half {
      flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column;
    }
    .half video {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #111;
    }

    /* Divider line between the two */
    .split .half:first-child { border-right: 1px solid rgba(255,255,255,0.1); }

    /* Subtitle overlay on each half — far left/right edges */
    .half-subtitles {
      position: absolute; bottom: 70px; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none;
      width: 45%; max-width: 300px; align-content: flex-end;
    }
    .half:first-child .half-subtitles { left: 12px; }
    .half:last-child .half-subtitles { right: 12px; left: auto; }

    /* Individual word boxes */
    .word-box {
      background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
      padding: 4px 10px; border-radius: 6px;
      font-size: 13px; font-weight: 600; color: #fff;
      display: inline-block; animation: wordIn 0.2s ease, wordOut 0.5s ease 3.5s forwards;
      white-space: nowrap;
    }
    .word-box.me { border: 1px solid rgba(96,165,250,0.5); }
    .word-box.them { border: 1px solid rgba(74,222,128,0.5); }

    @keyframes wordIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
    @keyframes wordOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-6px); } }

    /* Label badges */
    .label-badge {
      position: absolute; top: 12px; z-index: 10;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      padding: 4px 12px; border-radius: 16px;
      font-size: 11px; font-weight: 600; letter-spacing: 1px;
    }
    .half:first-child .label-badge { left: 12px; color: #4ade80; }
    .half:last-child .label-badge { right: 12px; color: #60a5fa; }

    /* Controls bar */
    .controls-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: center; gap: 14px;
      padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
    }
    .ctrl {
      width: 52px; height: 52px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; font-size: 20px;
      background: rgba(255,255,255,0.12); color: #fff;
    }
    .ctrl:active { transform: scale(0.9); }
    .ctrl.muted { background: #ef4444; }
    .ctrl.cam-off { background: #ef4444; }
    .ctrl.hang { background: #ef4444; width: 58px; height: 58px; font-size: 24px; }

    /* Room badge */
    .room-badge {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      padding: 5px 14px; border-radius: 16px;
      font-size: 11px; font-weight: 700; color: #4ade80; letter-spacing: 2px;
    }

    /* Waiting */
    .waiting {
      position: absolute; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(15,15,35,0.95);
    }
    .waiting .code { font-size: 36px; font-weight: 800; color: #4ade80; letter-spacing: 6px; margin-bottom: 12px; }
    .waiting .spin { width: 36px; height: 36px; border: 3px solid #222; border-top-color: #4ade80; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
    .waiting p { color: #666; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ VERTICAL (PORTRAIT) ============ */
    @media (orientation: portrait) {
      .split { flex-direction: column; }
      .half:first-child { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
    }
  </style>
</head>
<body>

  <!-- LOBBY -->
  <div id="lobby">
    <div class="lobby-title">Translator Call</div>
    <div class="lobby-sub">Speak any language. They hear theirs.</div>

    <div class="perm-box">
      <video class="perm-preview" id="permPreview" autoplay muted playsinline></video>
      <p>Allow camera & mic to start</p>
      <button class="btn btn-perm" id="btnPerm" onclick="requestPermissions()">Allow Camera & Mic</button>
      <div class="perm-status" id="permStatus"></div>
    </div>

    <button class="btn btn-create" id="btnCreate" onclick="createRoom()" disabled>Create Room</button>

    <div class="room-list">
      <div class="room-list-header">
        <h3>Active Rooms</h3>
        <button class="btn-sm" onclick="loadRooms()">Refresh</button>
      </div>
      <div id="roomList"><div class="empty-msg">No rooms yet</div></div>
    </div>
  </div>

  <!-- CALL — SPLIT SCREEN -->
  <div id="call">
    <div class="split">
      <!-- LEFT/TOP: Remote (them) -->
      <div class="half">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="label-badge">THEM</div>
        <div class="half-subtitles" id="subsThem"></div>
        <div class="waiting" id="waitingThem">
          <div class="code" id="waitingCode"></div>
          <div class="spin"></div>
          <p>Waiting for someone to join...</p>
        </div>
      </div>

      <!-- RIGHT/BOTTOM: Local (you) -->
      <div class="half">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="label-badge">YOU</div>
        <div class="half-subtitles" id="subsMe"></div>
      </div>
    </div>

    <div class="room-badge" id="roomBadge"></div>

    <div class="controls-bar">
      <button class="ctrl" id="btnMute" onclick="toggleMute()">🎤</button>
      <button class="ctrl" id="btnCam" onclick="toggleCam()">📹</button>
      <button class="ctrl hang" onclick="hangUp()">📞</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io()
    let localStream = null
    let peerConnection = null
    let currentRoom = null
    let otherUserId = null
    let recognition = null

    const config = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }

    // ============ PERMISSIONS ============
    async function requestPermissions() {
      const statusEl = document.getElementById('permStatus')
      const preview = document.getElementById('permPreview')
      try {
        statusEl.textContent = 'Requesting...'
        statusEl.className = 'perm-status'
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true })
        preview.srcObject = localStream
        preview.classList.add('active')
        statusEl.textContent = 'Camera & mic enabled!'
        statusEl.className = 'perm-status perm-ok'
        document.getElementById('btnPerm').textContent = 'Enabled'
        document.getElementById('btnPerm').disabled = true
        document.getElementById('btnCreate').disabled = false
      } catch (err) {
        statusEl.textContent = 'Permission denied. Allow in browser settings.'
        statusEl.className = 'perm-status perm-fail'
      }
    }

    // ============ ROOMS ============
    function loadRooms() { socket.emit('get-rooms', renderRooms) }
    function renderRooms(rooms) {
      const el = document.getElementById('roomList')
      if (!rooms.length) { el.innerHTML = '<div class="empty-msg">No rooms yet</div>'; return }
      el.innerHTML = rooms.map(r => `
        <div class="room-item" onclick="joinRoom('${r.id}')">
          <div><div class="room-code">${r.id}</div><div class="room-users">${r.users}/2 users</div></div>
          <button class="room-join-btn" onclick="event.stopPropagation();joinRoom('${r.id}')">Join</button>
        </div>`).join('')
    }
    socket.on('room-list', renderRooms)
    loadRooms()

    async function createRoom() {
      if (!localStream) return alert('Allow camera & mic first!')
      socket.emit('create-room', (roomId) => {
        currentRoom = roomId
        showCall(roomId)
      })
    }

    async function joinRoom(roomId) {
      if (!localStream) { await requestPermissions(); if (!localStream) return }
      socket.emit('join-room', roomId, (res) => {
        if (res.error) return alert(res.error)
        currentRoom = roomId
        showCall(roomId)
      })
    }

    function showCall(roomId) {
      document.getElementById('lobby').style.display = 'none'
      document.getElementById('call').classList.add('active')
      document.getElementById('roomBadge').textContent = roomId
      document.getElementById('waitingCode').textContent = roomId
      document.getElementById('localVideo').srcObject = localStream
      startSpeechRecognition()
    }

    // ============ SPEECH RECOGNITION ============
    function startSpeechRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition
      if (!SR) return
      recognition = new SR()
      recognition.continuous = true
      recognition.interimResults = false
      recognition.lang = 'auto'

      recognition.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (!e.results[i].isFinal) continue
          const text = e.results[i][0].transcript.trim()
          if (!text) return
          addSub('subsMe', text, 'me')
          socket.emit('chat-message', { to: otherUserId, text })
          translateAndSpeak(text)
        }
      }
      recognition.onerror = () => {}
      recognition.onend = () => { try { recognition.start() } catch(e) {} }
      try { recognition.start() } catch(e) {}
    }

    function addSub(containerId, text, who) {
      const container = document.getElementById(containerId)
      const words = text.split(/\s+/).filter(w => w.length > 0)
      const group = document.createElement('div')
      group.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;'
      words.forEach((word, i) => {
        const span = document.createElement('span')
        span.className = 'word-box ' + who
        span.textContent = word
        span.style.animationDelay = `${i * 0.08}s, ${3.5 + i * 0.08}s`
        group.appendChild(span)
      })
      container.appendChild(group)
      setTimeout(() => { if (group.parentNode) group.remove() }, 4500)
    }

    socket.on('chat-message', ({ text }) => {
      addSub('subsThem', text, 'them')
    })

    // ============ TRANSLATION (placeholder) ============
    async function translateAndSpeak(text) {
      console.log('Would translate:', text)
    }

    // ============ WEBRTC ============
    function createPeerConnection(userId) {
      otherUserId = userId
      peerConnection = new RTCPeerConnection(config)
      localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream))
      peerConnection.onicecandidate = (e) => {
        if (e.candidate && otherUserId) socket.emit('ice-candidate', { to: otherUserId, candidate: e.candidate })
      }
      peerConnection.ontrack = (e) => {
        document.getElementById('remoteVideo').srcObject = e.streams[0]
        document.getElementById('waitingThem').style.display = 'none'
      }
      return peerConnection
    }

    socket.on('user-joined', async (userId) => {
      const pc = createPeerConnection(userId)
      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
      socket.emit('offer', { to: userId, offer })
    })
    socket.on('offer', async ({ from, offer }) => {
      otherUserId = from
      const pc = createPeerConnection(from)
      await pc.setRemoteDescription(new RTCSessionDescription(offer))
      const answer = await pc.createAnswer()
      await pc.setLocalDescription(answer)
      socket.emit('answer', { to: from, answer })
    })
    socket.on('answer', async ({ answer }) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer))
    })
    socket.on('ice-candidate', async ({ candidate }) => {
      if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate))
    })
    socket.on('user-left', () => {
      document.getElementById('remoteVideo').srcObject = null
      document.getElementById('waitingThem').style.display = 'flex'
    })

    // ============ CONTROLS ============
    function toggleMute() {
      const a = localStream.getAudioTracks()[0]
      a.enabled = !a.enabled
      const btn = document.getElementById('btnMute')
      btn.classList.toggle('muted', !a.enabled)
      btn.textContent = a.enabled ? '🎤' : '🔇'
    }
    function toggleCam() {
      const v = localStream.getVideoTracks()[0]
      v.enabled = !v.enabled
      const btn = document.getElementById('btnCam')
      btn.classList.toggle('cam-off', !v.enabled)
      btn.textContent = v.enabled ? '📹' : '📷'
    }
    function hangUp() {
      if (recognition) recognition.stop()
      if (peerConnection) peerConnection.close()
      if (localStream) localStream.getTracks().forEach(t => t.stop())
      socket.disconnect()
      location.reload()
    }
  </script>
</body>
</html>
