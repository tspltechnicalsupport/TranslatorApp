<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Translator Call</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; height: 100dvh; overflow: hidden; }

    #lobby {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100dvh; padding: 20px; background: linear-gradient(135deg, #0f0f23, #1a1a3e, #0f0f23);
    }
    .lobby-title { font-size: 28px; font-weight: 800; margin-bottom: 6px; background: linear-gradient(135deg, #4ade80, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .lobby-sub { font-size: 13px; color: #666; margin-bottom: 24px; }
    .perm-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center; width: 100%; max-width: 340px; }
    .perm-box p { font-size: 13px; color: #888; margin-bottom: 14px; }
    .perm-preview { width: 100px; height: 75px; border-radius: 10px; object-fit: cover; background: #111; margin: 0 auto 14px; display: block; border: 2px solid #333; }
    .perm-preview.active { border-color: #4ade80; }
    .perm-steps { text-align: left; font-size: 11px; color: #666; margin-top: 10px; line-height: 1.8; display: none; }
    .perm-steps b { color: #f59e0b; }
    .btn { padding: 14px 24px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; max-width: 340px; min-height: 52px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .btn:active { transform: scale(0.97); }
    .btn-perm { background: linear-gradient(135deg, #f59e0b, #f97316); color: #000; }
    .btn-create { background: linear-gradient(135deg, #4ade80, #22c55e); color: #000; margin-bottom: 10px; }
    .btn:disabled { opacity: 0.3; }
    .room-list { width: 100%; max-width: 340px; margin-top: 20px; }
    .room-list-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .room-list-header h3 { font-size: 13px; color: #666; }
    .btn-sm { padding: 5px 12px; font-size: 11px; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; border: none; }
    .room-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
    .room-code { font-size: 18px; font-weight: 800; color: #4ade80; letter-spacing: 3px; }
    .room-users { font-size: 11px; color: #666; }
    .room-join-btn { background: #60a5fa; color: #000; padding: 7px 16px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; }
    .empty-msg { text-align: center; color: #444; font-size: 12px; padding: 16px; }
    .perm-status { font-size: 12px; margin-top: 10px; min-height: 18px; }
    .perm-ok { color: #4ade80; }
    .perm-fail { color: #ef4444; }

    #call { display: none; position: fixed; inset: 0; background: #000; }
    #call.active { display: block; }
    .half { position: absolute; overflow: hidden; }
    .half video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #111; }
    .divider { position: absolute; z-index: 12; background: rgba(255,255,255,0.15); }

    .half-subtitles {
      position: absolute; z-index: 15;
      display: flex; flex-wrap: wrap; gap: 5px; pointer-events: none;
      justify-content: center; align-items: flex-end; padding: 0 10px;
    }
    .word-group { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 4px; }
    .word-group.interim { opacity: 0.55; }
    .word-box {
      background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
      padding: 6px 14px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #fff;
      display: inline-block; white-space: nowrap;
      border: 1.5px solid rgba(255,255,255,0.3); opacity: 1;
      animation: popIn 0.15s ease-out;
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .word-box.me { border-color: rgba(96,165,250,0.7); }
    .word-box.them { border-color: rgba(74,222,128,0.7); }

    .label-badge { position: absolute; z-index: 15; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 4px 12px; border-radius: 16px; font-size: 11px; font-weight: 600; letter-spacing: 1px; }

    .controls-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: center; gap: 12px;
      padding: 14px; padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
    }
    .ctrl {
      width: 50px; height: 50px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; background: rgba(255,255,255,0.12); color: #fff;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .ctrl:active { transform: scale(0.9); }
    .ctrl.muted { background: #ef4444; }
    .ctrl.cam-off { background: #ef4444; }
    .ctrl.hang { background: #ef4444; width: 56px; height: 56px; font-size: 23px; }
    .ctrl.listening { background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,0.3); }

    .listen-status {
      position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      padding: 5px 12px; border-radius: 14px; font-size: 11px; color: #888; white-space: nowrap;
    }
    .listen-status.active { color: #4ade80; }

    .room-badge { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 4px 12px; border-radius: 14px; font-size: 11px; font-weight: 700; color: #4ade80; letter-spacing: 2px; }

    .waiting { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(15,15,35,0.95); }
    .waiting .code { font-size: 32px; font-weight: 800; color: #4ade80; letter-spacing: 5px; margin-bottom: 10px; }
    .waiting .spin { width: 32px; height: 32px; border: 3px solid #222; border-top-color: #4ade80; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px; }
    .waiting p { color: #666; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (orientation: landscape) {
      .half { top: 0; bottom: 0; width: 50%; }
      #halfThem { left: 0; }
      #halfMe { left: 50%; }
      .divider { top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%); }
      #halfThem .label-badge { top: 10px; left: 10px; color: #4ade80; }
      #halfMe .label-badge { top: 10px; right: 10px; color: #60a5fa; }
      #halfThem .half-subtitles { bottom: 90px; left: 10px; width: 40%; max-width: 260px; }
      #halfMe .half-subtitles { bottom: 90px; right: 10px; left: auto; width: 40%; max-width: 260px; }
      .listen-status { bottom: 80px; }
    }
    @media (orientation: portrait) {
      .half { left: 0; right: 0; height: 50%; }
      #halfThem { top: 0; }
      #halfMe { top: 50%; }
      .divider { left: 0; right: 0; top: 50%; height: 1px; transform: translateY(-50%); }
      #halfThem .label-badge { top: 10px; left: 10px; color: #4ade80; }
      #halfMe .label-badge { top: 10px; right: 10px; color: #60a5fa; }
      #halfThem .half-subtitles { bottom: 14px; left: 50%; transform: translateX(-50%); width: 90%; }
      #halfMe .half-subtitles { bottom: 14px; left: 50%; transform: translateX(-50%); width: 90%; }
      .listen-status { bottom: 76px; }
    }
  </style>
</head>
<body>

  <div id="lobby">
    <div class="lobby-title">Translator Call</div>
    <div class="lobby-sub">Speak any language. They hear theirs.</div>
    <div class="perm-box">
      <video class="perm-preview" id="permPreview" autoplay muted playsinline></video>
      <p>Allow camera & mic to start</p>
      <button class="btn btn-perm" id="btnPerm">Allow Camera & Mic</button>
      <div class="perm-status" id="permStatus"></div>
      <div class="perm-steps" id="permSteps">
        <b>Android Chrome:</b> Tap lock icon → Permissions → Allow<br><br>
        <b>iPhone Safari:</b> Settings → Safari → Camera → Allow<br><br>
        Then <b>reload this page</b>.
      </div>
    </div>
    <button class="btn btn-create" id="btnCreate" disabled>Create Room</button>
    <div class="room-list">
      <div class="room-list-header"><h3>Active Rooms</h3><button class="btn-sm" onclick="loadRooms()">Refresh</button></div>
      <div id="roomList"><div class="empty-msg">No rooms yet</div></div>
    </div>
  </div>

  <div id="call">
    <div class="half" id="halfThem">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label-badge" style="top:10px;left:10px;color:#4ade80;">THEM</div>
      <div class="half-subtitles" id="subsThem"></div>
      <div class="waiting" id="waitingThem">
        <div class="code" id="waitingCode"></div>
        <div class="spin"></div>
        <p>Waiting for someone to join...</p>
      </div>
    </div>
    <div class="half" id="halfMe">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="label-badge" style="top:10px;right:10px;color:#60a5fa;">YOU</div>
      <div class="half-subtitles" id="subsMe"></div>
    </div>
    <div class="divider"></div>
    <div class="room-badge" id="roomBadge"></div>
    <div class="listen-status" id="listenStatus">Tap 🗣️ to start</div>
    <div class="controls-bar">
      <button class="ctrl" id="btnListen">🗣️</button>
      <button class="ctrl" id="btnMute">🎤</button>
      <button class="ctrl" id="btnCam">📹</button>
      <button class="ctrl hang" id="btnHang">📞</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io()
    let localStream = null
    let peerConnection = null
    let currentRoom = null
    let otherUserId = null
    let recognition = null
    let myInterimGroup = null
    let myInterimCount = 0

    // ============ PERMISSIONS ============
    async function requestPermissions() {
      const statusEl = document.getElementById('permStatus')
      const stepsEl = document.getElementById('permSteps')
      const preview = document.getElementById('permPreview')
      const btn = document.getElementById('btnPerm')

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = 'Camera not supported'
        statusEl.className = 'perm-status perm-fail'
        return
      }

      btn.textContent = 'Requesting...'
      btn.disabled = true
      stepsEl.style.display = 'none'

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true })
        preview.srcObject = localStream
        preview.classList.add('active')
        statusEl.textContent = 'Camera & mic ready!'
        statusEl.className = 'perm-status perm-ok'
        btn.textContent = 'Enabled ✓'
        btn.style.background = '#22c55e'
        document.getElementById('btnCreate').disabled = false
      } catch (err) {
        btn.textContent = 'Tap to Retry'
        btn.disabled = false
        statusEl.textContent = 'Error: ' + err.name
        statusEl.className = 'perm-status perm-fail'
        if (err.name === 'NotAllowedError') stepsEl.style.display = 'block'
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true })
          statusEl.textContent = 'Mic works (no camera)'
          statusEl.className = 'perm-status perm-ok'
          document.getElementById('btnCreate').disabled = false
          btn.textContent = 'Mic OK ✓'
          btn.style.background = '#22c55e'
          stepsEl.style.display = 'none'
        } catch (e2) {}
      }
    }

    document.getElementById('btnPerm').addEventListener('click', requestPermissions)
    document.getElementById('btnPerm').addEventListener('touchend', e => { e.preventDefault(); requestPermissions() })

    // ============ ROOMS ============
    function loadRooms() { socket.emit('get-rooms', renderRooms) }
    function renderRooms(rooms) {
      const el = document.getElementById('roomList')
      if (!rooms.length) { el.innerHTML = '<div class="empty-msg">No rooms yet</div>'; return }
      el.innerHTML = rooms.map(r => '<div class="room-item" onclick="joinRoom(\'' + r.id + '\')"><div><div class="room-code">' + r.id + '</div><div class="room-users">' + r.users + '/2</div></div><button class="room-join-btn" onclick="event.stopPropagation();joinRoom(\'' + r.id + '\')">Join</button></div>').join('')
    }
    socket.on('room-list', renderRooms)
    loadRooms()

    document.getElementById('btnCreate').addEventListener('click', () => {
      if (!localStream) return
      socket.emit('create-room', (roomId) => { currentRoom = roomId; showCall(roomId) })
    })

    async function joinRoom(roomId) {
      if (!localStream) { await requestPermissions(); if (!localStream) return }
      socket.emit('join-room', roomId, (res) => {
        if (res.error) return alert(res.error)
        currentRoom = roomId
        showCall(roomId)
      })
    }

    function showCall(roomId) {
      document.getElementById('lobby').style.display = 'none'
      document.getElementById('call').classList.add('active')
      document.getElementById('roomBadge').textContent = roomId
      document.getElementById('waitingCode').textContent = roomId
      document.getElementById('localVideo').srcObject = localStream
    }

    // ============ SPEECH RECOGNITION ============
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)

    document.getElementById('btnListen').addEventListener('click', toggleListening)
    document.getElementById('btnListen').addEventListener('touchend', e => { e.preventDefault(); toggleListening() })

    function toggleListening() {
      if (recognition) { stopListening(); return }
      startListening()
    }

    function startListening() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition
      if (!SR) { alert('Speech recognition not supported'); return }
      if (recognition) return

      const r = new SR()
      recognition = r

      // Mobile: continuous=false (auto-restart). PC: continuous=true (fast).
      r.continuous = !isMobile
      r.interimResults = true
      r.lang = 'en-US'
      r.maxAlternatives = 1

      r.onstart = () => {
        document.getElementById('btnListen').classList.add('listening')
        document.getElementById('listenStatus').textContent = 'Listening...'
        document.getElementById('listenStatus').classList.add('active')
      }

      r.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i]
          if (!res || !res[0]) continue
          const text = res[0].transcript.trim()
          if (!text) continue

          if (res.isFinal) {
            addMyWords(text, false)
            if (otherUserId) socket.emit('chat-message', { to: otherUserId, text })
            myInterimGroup = null
            myInterimCount = 0
          } else {
            addMyWords(text, true)
          }
        }
      }

      r.onerror = (e) => {
        if (e.error === 'aborted' || e.error === 'no-speech') return
        if (e.error === 'not-allowed') {
          document.getElementById('listenStatus').textContent = 'Mic denied'
          stopListening()
        }
      }

      r.onend = () => {
        recognition = null
        myInterimGroup = null
        myInterimCount = 0

        // Mobile: auto-restart instantly
        if (isMobile && document.getElementById('btnListen').classList.contains('listening')) {
          startListening()
          return
        }

        document.getElementById('btnListen').classList.remove('listening')
        document.getElementById('listenStatus').textContent = 'Tap 🗣️ to start'
        document.getElementById('listenStatus').classList.remove('active')
      }

      try { r.start() } catch (e) {
        recognition = null
        setTimeout(startListening, 100)
      }
    }

    function stopListening() {
      if (recognition) {
        recognition.onend = null
        recognition.onerror = null
        recognition.onresult = null
        recognition.onstart = null
        try { recognition.stop() } catch (e) {}
        recognition = null
      }
      myInterimGroup = null
      myInterimCount = 0
      document.getElementById('btnListen').classList.remove('listening')
      document.getElementById('listenStatus').textContent = 'Tap 🗣️ to start'
      document.getElementById('listenStatus').classList.remove('active')
    }

    // ============ SUBTITLES ============
    socket.on('chat-message', ({ text }) => {
      addWords('subsThem', text, 'them', false)
    })

    function addMyWords(text, isInterim) {
      addWords('subsMe', text, 'me', isInterim)
    }

    function addWords(containerId, text, who, isInterim) {
      const container = document.getElementById(containerId)
      if (!container) return
      const words = text.split(/\s+/).filter(w => w.length > 0)

      if (who === 'me' && isInterim) {
        if (!myInterimGroup) {
          myInterimGroup = document.createElement('div')
          myInterimGroup.className = 'word-group interim'
          container.appendChild(myInterimGroup)
        }
        while (myInterimCount < words.length) {
          const span = document.createElement('span')
          span.className = 'word-box me'
          span.textContent = words[myInterimCount]
          myInterimGroup.appendChild(span)
          myInterimCount++
        }
      } else {
        if (who === 'me' && myInterimGroup) {
          myInterimGroup.remove()
          myInterimGroup = null
          myInterimCount = 0
        }
        const group = document.createElement('div')
        group.className = 'word-group'
        words.forEach(word => {
          const span = document.createElement('span')
          span.className = 'word-box ' + who
          span.textContent = word
          group.appendChild(span)
        })
        container.appendChild(group)
        setTimeout(() => {
          group.querySelectorAll('.word-box').forEach(w => w.style.opacity = '0')
          setTimeout(() => { if (group.parentNode) group.remove() }, 400)
        }, 3500)
      }
    }

    // ============ WEBRTC ============
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }

    function createPeerConnection(userId) {
      otherUserId = userId
      peerConnection = new RTCPeerConnection(rtcConfig)
      localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream))
      peerConnection.onicecandidate = (e) => {
        if (e.candidate && otherUserId) socket.emit('ice-candidate', { to: otherUserId, candidate: e.candidate })
      }
      peerConnection.ontrack = (e) => {
        document.getElementById('remoteVideo').srcObject = e.streams[0]
        document.getElementById('waitingThem').style.display = 'none'
      }
      return peerConnection
    }

    socket.on('user-joined', async (userId) => {
      const pc = createPeerConnection(userId)
      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
      socket.emit('offer', { to: userId, offer })
    })
    socket.on('offer', async ({ from, offer }) => {
      otherUserId = from
      const pc = createPeerConnection(from)
      await pc.setRemoteDescription(new RTCSessionDescription(offer))
      const answer = await pc.createAnswer()
      await pc.setLocalDescription(answer)
      socket.emit('answer', { to: from, answer })
    })
    socket.on('answer', async ({ answer }) => {
      if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(answer))
    })
    socket.on('ice-candidate', async ({ candidate }) => {
      if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate))
    })
    socket.on('user-left', () => {
      document.getElementById('remoteVideo').srcObject = null
      document.getElementById('waitingThem').style.display = 'flex'
    })

    // ============ CONTROLS ============
    document.getElementById('btnMute').addEventListener('click', () => {
      if (!localStream) return
      const a = localStream.getAudioTracks()[0]
      a.enabled = !a.enabled
      document.getElementById('btnMute').classList.toggle('muted', !a.enabled)
      document.getElementById('btnMute').textContent = a.enabled ? '🎤' : '🔇'
    })

    document.getElementById('btnCam').addEventListener('click', () => {
      if (!localStream) return
      const v = localStream.getVideoTracks()[0]
      v.enabled = !v.enabled
      document.getElementById('btnCam').classList.toggle('cam-off', !v.enabled)
      document.getElementById('btnCam').textContent = v.enabled ? '📹' : '📷'
    })

    document.getElementById('btnHang').addEventListener('click', () => {
      stopListening()
      if (peerConnection) peerConnection.close()
      if (localStream) localStream.getTracks().forEach(t => t.stop())
      socket.disconnect()
      location.reload()
    })
  </script>
</body>
</html>
