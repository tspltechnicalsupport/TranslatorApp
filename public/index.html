<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Call</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .container { text-align: center; max-width: 800px; width: 100%; padding: 20px; }

    h1 { font-size: 24px; margin-bottom: 20px; }

    .videos { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
    video { width: 320px; height: 240px; background: #0f0f23; border-radius: 12px; object-fit: cover; max-width: 45vw; }
    #localVideo { border: 3px solid #4ade80; }
    #remoteVideo { border: 3px solid #60a5fa; }

    .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }

    button { padding: 12px 24px; border-radius: 8px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-create { background: #4ade80; color: #000; }
    .btn-join { background: #60a5fa; color: #000; }
    .btn-hangup { background: #ef4444; color: #fff; }
    .btn-refresh { background: #333; color: #fff; font-size: 14px; padding: 8px 16px; }
    .btn-perm { background: #f59e0b; color: #000; margin-bottom: 20px; }
    button:hover { opacity: 0.85; transform: translateY(-1px); }

    .room-info { font-size: 14px; color: #888; margin-bottom: 10px; }
    .room-id { font-size: 28px; font-weight: 800; color: #4ade80; letter-spacing: 4px; margin-bottom: 20px; }

    .status { font-size: 14px; color: #888; margin-top: 10px; }
    .status.connected { color: #4ade80; }
    .status.error { color: #ef4444; }

    .hidden { display: none; }

    .room-list { margin: 20px 0; }
    .room-list h3 { font-size: 16px; color: #888; margin-bottom: 10px; }
    .room-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #0f0f23; border: 1px solid #333; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
    }
    .room-item:hover { border-color: #60a5fa; background: #1a1a3e; }
    .room-item .room-code { font-size: 18px; font-weight: 700; color: #4ade80; letter-spacing: 2px; }
    .room-item .room-users { font-size: 13px; color: #888; }
    .room-item .room-join { background: #60a5fa; color: #000; padding: 6px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
    .room-item .room-join:hover { opacity: 0.8; }

    .empty-msg { color: #666; font-size: 14px; margin: 20px 0; }

    .perm-box {
      background: #0f0f23; border: 2px solid #f59e0b; border-radius: 12px;
      padding: 20px; margin-bottom: 20px; text-align: center;
    }
    .perm-box p { font-size: 14px; color: #ccc; margin-bottom: 15px; }
    .perm-status { font-size: 13px; margin-top: 10px; }
    .perm-granted { color: #4ade80; }
    .perm-denied { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Video Call</h1>

    <div id="lobby">
      <div class="perm-box">
        <p>Camera and microphone access is required for video calls.</p>
        <button class="btn-perm" onclick="requestPermissions()">Allow Camera & Mic</button>
        <div class="perm-status" id="permStatus"></div>
      </div>

      <button class="btn-create" id="btnCreate" onclick="createRoom()" disabled>Create Room</button>

      <div class="room-list">
        <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px;">
          <h3>Available Rooms</h3>
          <button class="btn-refresh" onclick="loadRooms()">Refresh</button>
        </div>
        <div id="roomListContainer">
          <div class="empty-msg">No rooms yet. Create one to start.</div>
        </div>
      </div>
    </div>

    <div id="call" class="hidden">
      <div class="room-info">Room Code</div>
      <div class="room-id" id="displayRoomId"></div>
      <div class="videos">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
      <div class="controls">
        <button class="btn-hangup" onclick="hangUp()">Hang Up</button>
      </div>
      <div class="status" id="status">Connecting...</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io()
    let localStream = null
    let peerConnection = null
    let currentRoom = null
    let otherUserId = null

    const config = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }

    async function requestPermissions() {
      const statusEl = document.getElementById('permStatus')
      try {
        statusEl.textContent = 'Requesting access...'
        statusEl.className = 'perm-status'

        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: true
        })

        document.getElementById('localVideo').srcObject = localStream
        statusEl.textContent = 'Camera and mic enabled!'
        statusEl.className = 'perm-status perm-granted'
        document.getElementById('btnCreate').disabled = false
      } catch (err) {
        console.error('Permission error:', err)
        statusEl.textContent = 'Permission denied. Please allow camera/mic in browser settings.'
        statusEl.className = 'perm-status perm-denied'
      }
    }

    function loadRooms() {
      socket.emit('get-rooms', (rooms) => {
        renderRooms(rooms)
      })
    }

    function renderRooms(rooms) {
      const container = document.getElementById('roomListContainer')
      if (rooms.length === 0) {
        container.innerHTML = '<div class="empty-msg">No rooms yet. Create one to start.</div>'
        return
      }
      container.innerHTML = rooms.map(r => `
        <div class="room-item" onclick="joinRoom('${r.id}')">
          <div>
            <div class="room-code">${r.id}</div>
            <div class="room-users">${r.users}/2 users</div>
          </div>
          <button class="room-join" onclick="event.stopPropagation(); joinRoom('${r.id}')">Join</button>
        </div>
      `).join('')
    }

    socket.on('room-list', (rooms) => {
      renderRooms(rooms)
    })

    loadRooms()

    async function createRoom() {
      if (!localStream) return alert('Allow camera and mic first!')
      socket.emit('create-room', (roomId) => {
        currentRoom = roomId
        showCall(roomId)
        setStatus('Waiting for someone to join...')
      })
    }

    async function joinRoom(roomId) {
      if (!localStream) {
        await requestPermissions()
        if (!localStream) return alert('Allow camera and mic first!')
      }
      socket.emit('join-room', roomId, (res) => {
        if (res.error) return alert(res.error)
        currentRoom = roomId
        showCall(roomId)
        setStatus('Connected! Setting up call...')
      })
    }

    function showCall(roomId) {
      document.getElementById('lobby').classList.add('hidden')
      document.getElementById('call').classList.remove('hidden')
      document.getElementById('displayRoomId').textContent = roomId
    }

    function setStatus(text) {
      const el = document.getElementById('status')
      el.textContent = text
      el.classList.toggle('connected', text.includes('Connected'))
    }

    function createPeerConnection(userId) {
      otherUserId = userId
      peerConnection = new RTCPeerConnection(config)

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream)
      })

      peerConnection.onicecandidate = (e) => {
        if (e.candidate && otherUserId) {
          socket.emit('ice-candidate', { to: otherUserId, candidate: e.candidate })
        }
      }

      peerConnection.ontrack = (e) => {
        document.getElementById('remoteVideo').srcObject = e.streams[0]
        setStatus('Connected!')
      }

      return peerConnection
    }

    socket.on('user-joined', async (userId) => {
      const pc = createPeerConnection(userId)
      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
      socket.emit('offer', { to: userId, offer })
    })

    socket.on('offer', async ({ from, offer }) => {
      otherUserId = from
      const pc = createPeerConnection(from)
      await pc.setRemoteDescription(new RTCSessionDescription(offer))
      const answer = await pc.createAnswer()
      await pc.setLocalDescription(answer)
      socket.emit('answer', { to: from, answer })
      setStatus('Connected!')
    })

    socket.on('answer', async ({ from, answer }) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer))
      setStatus('Connected!')
    })

    socket.on('ice-candidate', async ({ from, candidate }) => {
      if (peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate))
      }
    })

    socket.on('user-left', () => {
      document.getElementById('remoteVideo').srcObject = null
      setStatus('Other user disconnected')
    })

    function hangUp() {
      if (peerConnection) peerConnection.close()
      if (localStream) localStream.getTracks().forEach(t => t.stop())
      socket.disconnect()
      location.reload()
    }
  </script>
</body>
</html>
